apiVersion: v1
kind: Namespace
metadata:
  name: monitor-in-hand-test
  labels:
    app.kubernetes.io/managed-by: monitor-in-hand-test-fixture
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-agent
  namespace: monitor-in-hand-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitor-in-hand-test-prometheus-agent
  labels:
    app.kubernetes.io/managed-by: monitor-in-hand-test-fixture
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitor-in-hand-test-prometheus-agent
  labels:
    app.kubernetes.io/managed-by: monitor-in-hand-test-fixture
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitor-in-hand-test-prometheus-agent
subjects:
  - kind: ServiceAccount
    name: prometheus-agent
    namespace: monitor-in-hand-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-target
  namespace: monitor-in-hand-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-target
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-target
        monitoring.fjsxy.github.io/test-fixture: "true"
    spec:
      containers:
        - name: node-exporter
          image: __NODE_EXPORTER_IMAGE__
          args:
            - --collector.disable-defaults
            - --collector.uname
            - --web.listen-address=:9100
          ports:
            - name: metrics
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-target
  namespace: monitor-in-hand-test
  labels:
    app.kubernetes.io/name: metrics-target
    monitoring.fjsxy.github.io/test-fixture: "true"
spec:
  selector:
    app.kubernetes.io/name: metrics-target
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
    - name: web
      port: 80
      targetPort: metrics
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metrics-target
  namespace: monitor-in-hand-test
  labels:
    monitoring.fjsxy.github.io/test-fixture: "true"
spec:
  rules:
    - host: metrics-target.monitor-in-hand-test.svc
      http:
        paths:
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: metrics-target
                port:
                  name: web
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter
  namespace: monitor-in-hand-test
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          preferred_ip_protocol: ip4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitor-in-hand-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blackbox-exporter
    spec:
      containers:
        - name: blackbox-exporter
          image: __BLACKBOX_EXPORTER_IMAGE__
          args:
            - --config.file=/etc/blackbox/blackbox.yml
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitor-in-hand-test
spec:
  selector:
    app.kubernetes.io/name: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: vmstorage
  namespace: monitor-in-hand-test
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: vmstorage
  ports:
    - name: insert
      port: 8400
    - name: select
      port: 8401
    - name: http
      port: 8482
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vmstorage
  namespace: monitor-in-hand-test
spec:
  serviceName: vmstorage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmstorage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmstorage
    spec:
      containers:
        - name: vmstorage
          image: __VMSTORAGE_IMAGE__
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=1d
          ports:
            - name: insert
              containerPort: 8400
            - name: select
              containerPort: 8401
            - name: http
              containerPort: 8482
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: storage
              mountPath: /storage
      volumes:
        - name: storage
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vminsert
  namespace: monitor-in-hand-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vminsert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vminsert
    spec:
      containers:
        - name: vminsert
          image: __VMINSERT_IMAGE__
          args:
            - -storageNode=vmstorage.monitor-in-hand-test.svc:8400
          ports:
            - name: http
              containerPort: 8480
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: vminsert
  namespace: monitor-in-hand-test
spec:
  selector:
    app.kubernetes.io/name: vminsert
  ports:
    - name: http
      port: 8480
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmselect
  namespace: monitor-in-hand-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmselect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmselect
    spec:
      containers:
        - name: vmselect
          image: __VMSELECT_IMAGE__
          args:
            - -storageNode=vmstorage.monitor-in-hand-test.svc:8401
          ports:
            - name: http
              containerPort: 8481
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: vmselect
  namespace: monitor-in-hand-test
spec:
  selector:
    app.kubernetes.io/name: vmselect
  ports:
    - name: http
      port: 8481
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fixture
  namespace: monitor-in-hand-test
  labels:
    monitoring.fjsxy.github.io/test-fixture: "true"
spec:
  selector:
    matchLabels:
      monitoring.fjsxy.github.io/test-fixture: "true"
  endpoints:
    - port: metrics
      interval: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fixture
  namespace: monitor-in-hand-test
  labels:
    monitoring.fjsxy.github.io/test-fixture: "true"
spec:
  selector:
    matchLabels:
      monitoring.fjsxy.github.io/test-fixture: "true"
  podMetricsEndpoints:
    - port: metrics
      interval: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: fixture
  namespace: monitor-in-hand-test
  labels:
    monitoring.fjsxy.github.io/test-fixture: "true"
spec:
  jobName: fixture-probe
  prober:
    url: blackbox-exporter.monitor-in-hand-test.svc:9115
  module: http_2xx
  targets:
    staticConfig:
      static:
        - http://metrics-target.monitor-in-hand-test.svc:9100/metrics
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: fixture
  namespace: monitor-in-hand-test
  labels:
    monitoring.fjsxy.github.io/test-fixture: "true"
spec:
  staticConfigs:
    - targets:
        - metrics-target.monitor-in-hand-test.svc:9100
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: fixture-pod
  namespace: monitor-in-hand-test
  labels:
    monitoring.fjsxy.github.io/test-fixture: "true"
spec:
  kubernetesSDConfigs:
    - role: Pod
      namespaces:
        names: [monitor-in-hand-test]
      selectors:
        - role: Pod
          label: monitoring.fjsxy.github.io/test-fixture=true
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: fixture-service
  namespace: monitor-in-hand-test
  labels:
    monitoring.fjsxy.github.io/test-fixture: "true"
spec:
  kubernetesSDConfigs:
    - role: Service
      namespaces:
        names: [monitor-in-hand-test]
