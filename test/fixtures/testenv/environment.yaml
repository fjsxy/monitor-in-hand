apiVersion: monitoring.coreos.com/v1alpha1
kind: PrometheusAgent
metadata:
  name: fixture
  namespace: monitor-in-hand-test
spec:
  version: v2.55.1
  image: __PROMETHEUS_IMAGE__
  serviceAccountName: prometheus-agent
  replicas: 1
  shards: 1
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 64Mi
  serviceDiscoveryRole: __SERVICE_DISCOVERY_ROLE__
  serviceMonitorSelector:
    matchLabels:
      monitoring.fjsxy.github.io/test-fixture: "true"
  podMonitorSelector:
    matchLabels:
      monitoring.fjsxy.github.io/test-fixture: "true"
  probeSelector:
    matchLabels:
      monitoring.fjsxy.github.io/test-fixture: "true"
  scrapeConfigSelector:
    matchLabels:
      monitoring.fjsxy.github.io/test-fixture: "true"
  remoteWrite:
    - name: fixture-vm
      url: http://vminsert.monitor-in-hand-test.svc:8480/insert/0/prometheus/api/v1/write
