name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.12
          cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0
      - name: 构建、测试与 Chart 校验
        run: |
          make typecheck
          make test HELM=helm
          make lint-chart HELM=helm
      - name: 验证生成物同步
        run: make verify-generated
      - name: 上传 UT、IT、Helm JUnit 与 unit coverage 证据
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: blocking-quality-${{ github.run_id }}
          path: artifacts/test-results/
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.19"
            node_image: kindest/node:v1.19.16@sha256:476cb3269232888437b61deca013832fee41f9f074f9bed79f57e4280f7c48b7
          - kubernetes: "1.28"
            node_image: kindest/node:v1.28.15@sha256:a7c05c7ae043a0b8c818f5a06188bc2c4098f6cb59ca7d1856df00375d839251
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.12
          cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0
      - uses: helm/kind-action@v1.12.0
        with:
          install_only: true
          version: v0.33.0
      - name: Kubernetes ${{ matrix.kubernetes }} 最小安装 smoke
        env:
          HELM_BIN: helm
          KIND_NODE_IMAGE: ${{ matrix.node_image }}
        run: hack/smoke-install.sh

  test-environment:
    name: e2e-${{ matrix.lane }} (Kubernetes ${{ matrix.kubernetes }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.19"
            kubectl: "v1.19.16"
            run_id_suffix: "119"
            lane: ksm
            target: e2e-kubestatemetrics
          - kubernetes: "1.19"
            kubectl: "v1.19.16"
            run_id_suffix: "119"
            lane: agent
            target: e2e-agent
          - kubernetes: "1.28"
            kubectl: "v1.28.15"
            run_id_suffix: "128"
            lane: ksm
            target: e2e-kubestatemetrics
          - kubernetes: "1.28"
            kubectl: "v1.28.15"
            run_id_suffix: "128"
            lane: agent
            target: e2e-agent
          - kubernetes: "1.19"
            kubectl: "v1.19.16"
            run_id_suffix: "119"
            lane: sm
            target: e2e-servicemonitor
          - kubernetes: "1.28"
            kubectl: "v1.28.15"
            run_id_suffix: "128"
            lane: sm
            target: e2e-servicemonitor
    env:
      KUBERNETES_VERSION: ${{ matrix.kubernetes }}
      TEST_RUN_ID: ci-${{ github.run_id }}-${{ matrix.run_id_suffix }}-${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.12
          cache: true
      - uses: helm/kind-action@v1.12.0
        with:
          install_only: true
          version: v0.33.0
      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ matrix.kubectl }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0
      - name: 创建并验收外部测试环境
        run: |
          make test-env-up
          make test-env-verify
      - name: E2E ${{ matrix.lane }}
        run: make ${{ matrix.target }} HELM=helm
      - name: 上传 E2E 测试报告
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}-${{ matrix.run_id_suffix }}-${{ matrix.lane }}-${{ matrix.kubernetes }}
          path: artifacts/e2e/
          if-no-files-found: error
      - name: 保存测试环境证据
        if: ${{ always() }}
        continue-on-error: true
        run: make test-env-evidence
      - name: 上传测试环境证据
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-environment-${{ matrix.run_id_suffix }}-${{ matrix.lane }}-${{ github.run_id }}
          path: artifacts/test-env/
          if-no-files-found: warn
      - name: 清理本次测试环境
        if: ${{ always() }}
        run: make test-env-down

  phase1-release-gate:
    name: 一期阻断式发布门禁
    if: ${{ always() }}
    needs:
      - quality
      - smoke
      - test-environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.12
          cache: true
      - name: 下载本次 E2E JUnit
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-${{ github.run_id }}-*
          path: artifacts/e2e
          merge-multiple: false
      - name: 下载本次 UT、IT 与 Helm JUnit
        uses: actions/download-artifact@v4
        with:
          name: blocking-quality-${{ github.run_id }}
          path: artifacts/quality
      - name: 校验一期全部 blocking JUnit
        run: >-
          go run ./cmd/phase1-gate
          --reports artifacts
          --expected-blocking-count 209
          --expected-e2e-count 71
      - name: 校验全部上游 blocking job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          E2E_RESULT: ${{ needs.test-environment.result }}
        run: |
          test "${QUALITY_RESULT}" = success
          test "${SMOKE_RESULT}" = success
          test "${E2E_RESULT}" = success
