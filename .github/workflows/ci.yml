name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.12
          cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0
      - name: 构建、测试与 Chart 校验
        run: |
          make typecheck
          make test HELM=helm
          make lint-chart HELM=helm
      - name: 验证生成物同步
        run: make verify-generated

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.19"
            node_image: kindest/node:v1.19.16@sha256:476cb3269232888437b61deca013832fee41f9f074f9bed79f57e4280f7c48b7
          - kubernetes: "1.28"
            node_image: kindest/node:v1.28.15@sha256:a7c05c7ae043a0b8c818f5a06188bc2c4098f6cb59ca7d1856df00375d839251
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.12
          cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0
      - uses: helm/kind-action@v1.12.0
        with:
          install_only: true
          version: v0.33.0
      - name: Kubernetes ${{ matrix.kubernetes }} 最小安装 smoke
        env:
          HELM_BIN: helm
          KIND_NODE_IMAGE: ${{ matrix.node_image }}
        run: hack/smoke-install.sh
