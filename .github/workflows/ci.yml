name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.12
          cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0
      - name: 构建、测试与 Chart 校验
        run: |
          make typecheck
          make test HELM=helm
          make lint-chart HELM=helm
      - name: 验证生成物同步
        run: make verify-generated

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.19"
            node_image: kindest/node:v1.19.16@sha256:476cb3269232888437b61deca013832fee41f9f074f9bed79f57e4280f7c48b7
          - kubernetes: "1.28"
            node_image: kindest/node:v1.28.15@sha256:a7c05c7ae043a0b8c818f5a06188bc2c4098f6cb59ca7d1856df00375d839251
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.12
          cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0
      - uses: helm/kind-action@v1.12.0
        with:
          install_only: true
          version: v0.33.0
      - name: Kubernetes ${{ matrix.kubernetes }} 最小安装 smoke
        env:
          HELM_BIN: helm
          KIND_NODE_IMAGE: ${{ matrix.node_image }}
        run: hack/smoke-install.sh

  test-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.19"
            kubectl: "v1.19.16"
            run_id_suffix: "119"
          - kubernetes: "1.28"
            kubectl: "v1.28.15"
            run_id_suffix: "128"
    env:
      KUBERNETES_VERSION: ${{ matrix.kubernetes }}
      TEST_RUN_ID: ci-${{ github.run_id }}-${{ matrix.run_id_suffix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.12
          cache: true
      - uses: helm/kind-action@v1.12.0
        with:
          install_only: true
          version: v0.33.0
      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ matrix.kubectl }}
      - name: 创建并验收外部测试环境
        run: |
          make test-env-up
          make test-env-verify
      - name: E2E 严格部署预检
        run: make e2e-preflight
      - name: 上传 E2E 测试报告
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-preflight-${{ matrix.run_id_suffix }}-${{ github.run_id }}
          path: artifacts/e2e/
          if-no-files-found: error
      - name: 失败时保存测试环境证据
        if: ${{ failure() }}
        continue-on-error: true
        run: make test-env-evidence
      - name: 上传测试环境证据
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-environment-${{ matrix.run_id_suffix }}-${{ github.run_id }}
          path: artifacts/test-env/
          if-no-files-found: warn
      - name: 清理本次测试环境
        if: ${{ always() }}
        run: make test-env-down
