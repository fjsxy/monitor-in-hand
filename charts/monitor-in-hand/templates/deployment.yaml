{{- include "monitor-in-hand.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitor-in-hand.fullname" . }}
  labels:
    {{- include "monitor-in-hand.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "monitor-in-hand.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "monitor-in-hand.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "monitor-in-hand.fullname" . }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
        {{- range $key, $value := .Values.nodeSelector }}
        {{- if ne $key "kubernetes.io/os" }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ if .Values.image.digest }}{{ printf "docker.io/fjsxy/monitor-in-hand@%s" .Values.image.digest | quote }}{{ else }}{{ printf "docker.io/fjsxy/monitor-in-hand:%s" .Chart.AppVersion | quote }}{{ end }}
          imagePullPolicy: IfNotPresent
          args:
            - "--leader-elect=true"
            - {{ printf "--health-probe-bind-address=:%v" .Values.healthProbe.port | quote }}
            - {{ printf "--log-level=%s" .Values.logLevel | quote }}
          ports:
            - name: health
              containerPort: {{ .Values.healthProbe.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
